name: build
on: [workflow_dispatch]
jobs:
    build:
      permissions:
        contents: read
        packages: write

      runs-on: ubuntu-latest
      steps:
        - name: checkout
          uses: actions/checkout@v6

        - name: setup java
          uses: actions/setup-java@v6
          with:
            java-version-file: '.sdkmanrc'
            cache: 'maven'
            cache-dependency-path: |
              ./pom.xml
              ./src/tools/buf-maven-plugin/pom.xml
              ./src/be/grpc-server/pom.xml

        # Install the in-repo buf-maven-plugin so grpc-server can resolve it.
        # jib:build has to run on grpc-server alone, so a reactor build from the root won't do here
        - name: install buf-maven-plugin
          run: mvn install --projects src/tools/buf-maven-plugin -Dinvoker.skip --batch-mode

        - name: maven build
          env:
            REGISTRY_USER: ${{ github.actor }}
            REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          working-directory: './src/be/grpc-server'
          run: |
            mvn compile jib:build \
              -Djib.to.auth.username=$REGISTRY_USER \
              -Djib.to.auth.password=$REGISTRY_TOKEN \
              --batch-mode