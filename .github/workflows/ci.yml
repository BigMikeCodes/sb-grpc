name: ci
on: [workflow_dispatch]
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: 'ghcr.io/bigmikecodes/sb-grpc:${{ github.sha }}'
      TRIVY_VERSION: 'v0.75.0'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup buf
        uses: bufbuild/buf-action@v1
        with:
          version: 1.66.1
          setup_only: true

      - name: setup java
        uses: actions/setup-java@v6
        with:
          java-version-file: '.sdkmanrc'
          cache: 'maven'
          cache-dependency-path: './src/be/grpc-server/pom.xml'

      - name: maven build
        working-directory: './src/be/grpc-server'
        run: |
          mvn \
          --batch-mode \
          --activate-profiles=ci \
          verify

      - name: Trivy - Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: 'sarif'
          hide-progress: true
          output: 'trivy-results.sarif'
          version: ${{ env.TRIVY_VERSION }}

      - name: Upload trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: SBOM - Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: 'cyclonedx'
          hide-progress: true
          output: 'sbom.json'
          version: ${{ env.TRIVY_VERSION }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: 'image-sbom'
          path: 'sbom.json'