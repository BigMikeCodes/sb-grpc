name: ci
on: [workflow_dispatch]
jobs:
  ci:
    strategy:
      matrix:
        include:
          # amd64
          - os: 'ubuntu-26.04'
            platform: 'linux/amd64'
            name: 'amd64'
          # arm64
          - os: 'ubuntu-26.04-arm'
            platform: 'linux/arm64'
            name: 'arm64'

    runs-on: ${{ matrix.os }}
    env:
      IMAGE_REF: 'ghcr.io/bigmikecodes/sb-grpc:${{ github.sha }}'
      TRIVY_VERSION: 'v0.75.0'
      BUF_VERSION: '1.66.1'

    permissions:
      contents: read
      security-events: write
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup buf
        uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true

      - name: setup java
        uses: actions/setup-java@v6
        with:
          java-version-file: '.sdkmanrc'
          cache: 'maven'
          cache-dependency-path: './src/be/grpc-server/pom.xml'

      - name: maven build
        working-directory: './src/be/grpc-server'
        run: |
          mvn \
          --batch-mode \
          --activate-profiles=ci \
          -Djib.from.platforms=${{ matrix.platform }} \
          verify

      # Produce SBOM from the built image
      - name: Trivy - SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: 'cyclonedx'
          hide-progress: true
          output: 'sbom.cdx.json'
          version: ${{ env.TRIVY_VERSION }}

      # Scan the SBOM from prior step
      - name: Trivy - Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'sbom'
          format: 'sarif'
          scan-ref: 'sbom.cdx.json'
          hide-progress: true
          output: 'trivy-results.sarif'
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: 'true'

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: '${{ matrix.name }}-sbom'
          path: '${{ matrix.name }}.cdx.json'